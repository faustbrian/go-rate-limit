schema_version: 1
tool_version: v2.1.1
tool_checksums_sha256: 4e0a38f76cbff547541f3164a0e59e958cf2f62d7b5cea19d7a4d1c51fe5e977

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/http
        - ./adapters/slog
        - ./adapters/authentication
        - ./adapters/queue
        - ./adapters/otel
        - ./memory
        - ./postgres
        - ./ratelimithttp
        - ./ratelimitlog
        - ./ratelimitprincipal
        - ./ratelimitqueue
        - ./ratelimitrpc
        - ./ratelimittelemetry
        - ./ratelimittest
        - ./valkey

operations:
  # Cancellation must leave admission/lease state and the lock owner intact.
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [./memory]
        run: '^Test(AdmitStrictCancellationInterruptsLockWait|StrictMemoryCancellationAfterLockDoesNotMutate|StrictMemoryLeaseLockWaitCancellation)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzNewKeyNeverLeaksHashedSubject$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzDecodeStateNeverPanics$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./ratelimithttp]
        fuzz: '^FuzzTrustedProxyChainNeverPanics$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./adapters/http]
        fuzz: '^FuzzClientIPNeverPanics$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./valkey]
        fuzz: '^FuzzDecodeDecisionNeverPanics$'
        budget: 100x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 20m
